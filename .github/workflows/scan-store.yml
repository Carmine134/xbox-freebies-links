name: Scan the store for free items

# Walks Microsoft's own sitemaps and prices every product through the public catalog
# API. No secrets, no account, and nobody has to run the app.
#
# The full price history lives in the Actions cache because it is large and changes
# daily; only the small free / newly-free lists are committed.
on:
  schedule:
    - cron: "40 4 * * *"    # daily, 04:40 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "full = price the whole store, daily = the usual slice"
        type: choice
        options: [daily, full]
        default: daily
      markets:
        description: "Space separated, e.g. 'US TR DE GB'"
        default: "US TR DE GB NO IS HU"

permissions:
  contents: write

concurrency:
  group: scan-store
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Restore yesterday's prices so today's run can tell what changed
      - name: Restore price history
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Scan
        run: |
          for market in ${{ github.event.inputs.markets || 'US TR DE GB NO IS HU' }}; do
            python scripts/scan_catalog.py --market "$market" --mode "${{ github.event.inputs.mode || 'daily' }}"
          done

      - name: Save price history
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: prices-${{ github.run_id }}

      # A scan runs for hours and other commits land meanwhile, so the checkout this
      # job started from is stale by the end. These files are written whole each run,
      # so the newest reading simply goes on top of whatever master holds now.
      - name: Commit the free lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/scan
          cp free-*.json newly-free-*.json index-*.json.gz /tmp/scan/
          for attempt in 1 2 3; do
            git fetch origin master
            git reset --hard origin/master
            cp /tmp/scan/* .
            git add free-*.json newly-free-*.json index-*.json.gz
            if git diff --cached --quiet; then   # --cached: a brand new file is a change too
              echo "Nothing changed."
              exit 0
            fi
            free=$(python -c "import json;print(json.load(open('free-US.json'))['count'])")
            new=$(python -c "import json;print(json.load(open('newly-free-US.json'))['count'])")
            git commit -m "Store scan: ${free} free, ${new} newly free"
            git push origin HEAD:master && exit 0
            echo "Something else pushed first, trying again"
          done
          exit 1
